services:
  agent:
    image: coding-agent
    # container_name: xxx (the Docker container name)
    stdin_open: true
    tty: true
    mem_limit: 16g
    memswap_limit: 16g
    cpus: 4
    pids_limit: 512
    environment:
      - PATH=/opt/venv/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - IS_SANDBOX=1
    volumes:
      # Run Compose from a project folder inside WSL/Ubuntu or the Multipass VM.
      # That Linux folder is the project workspace; do not run from /mnt/c.
      - .:/home/agent/project
      # Stores opencode's login at /root/.local/share/opencode/auth.json.
      - opencode-shared:/root
    working_dir: /home/agent/project
volumes:
  opencode-shared:
    external: true
