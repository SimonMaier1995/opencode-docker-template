services:
  agent:
    image: coding-agent
    # container_name: xxx (the Docker container name)
    stdin_open: true
    tty: true
    mem_limit: 16g
    memswap_limit: 16g
    cpus: 4
    pids_limit: 512
    environment:
      - PATH=/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - IS_SANDBOX=1
    volumes:
      # Project files are stored in Docker, not mounted from Windows.
      # Set PROJECT_NAME to choose the directory and isolated project volume.
      - project-data:/home/simon/${PROJECT_NAME:-project_x}
      # Stores opencode's login at /root/.local/share/opencode/auth.json.
      - opencode-shared:/root
    working_dir: /home/simon/${PROJECT_NAME:-project_x}
volumes:
  project-data:
    name: opencode-project-${PROJECT_NAME:-project_x}
  opencode-shared:
    external: true
